<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1042"/>
      <stop offset="100%" stop-color="#0d061e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.5" shape-rendering="geometricPrecision"/>
  <!-- Neon ambient glow -->
  <circle cx="16" cy="16" r="9" fill="#a855f7" opacity="0.2" filter="url(#glow)"/>
  <!-- Alien Pixel Sprite (12x10, scale=2, offset=(4, 6)) -->
  <g fill="#a855f7">
    <!-- Row 0: Antennae tips -->
    <rect x="8" y="6" width="2" height="2" fill="#e9d5ff"/>
    <rect x="22" y="6" width="2" height="2" fill="#e9d5ff"/>
    <!-- Row 1: Antennae stalk -->
    <rect x="10" y="8" width="2" height="2" fill="#c084fc"/>
    <rect x="20" y="8" width="2" height="2" fill="#c084fc"/>
    <!-- Row 2: Forehead -->
    <rect x="8" y="10" width="16" height="2" fill="#c084fc"/>
    <!-- Row 3: Eyes row (face with eye holes) -->
    <rect x="6" y="12" width="4" height="2" fill="#a855f7"/>
    <rect x="14" y="12" width="4" height="2" fill="#a855f7"/>
    <rect x="22" y="12" width="4" height="2" fill="#a855f7"/>
    <!-- Row 4: Full cheeks / face -->
    <rect x="4" y="14" width="24" height="2" fill="#a855f7"/>
    <!-- Row 5: Arms & chest -->
    <rect x="4" y="16" width="2" height="2" fill="#c084fc"/>
    <rect x="8" y="16" width="16" height="2" fill="#9333ea"/>
    <rect x="26" y="16" width="2" height="2" fill="#c084fc"/>
    <!-- Row 6: Lower arms -->
    <rect x="4" y="18" width="2" height="2" fill="#9333ea"/>
    <rect x="8" y="18" width="2" height="2" fill="#7e22ce"/>
    <rect x="22" y="18" width="2" height="2" fill="#7e22ce"/>
    <rect x="26" y="18" width="2" height="2" fill="#9333ea"/>
    <!-- Row 7: Waist -->
    <rect x="8" y="20" width="4" height="2" fill="#7e22ce"/>
    <rect x="20" y="20" width="4" height="2" fill="#7e22ce"/>
    <!-- Row 8: Legs -->
    <rect x="6" y="22" width="4" height="2" fill="#7e22ce"/>
    <rect x="22" y="22" width="4" height="2" fill="#7e22ce"/>
    <!-- Row 9: Feet -->
    <rect x="4" y="24" width="4" height="2" fill="#6b21a8"/>
    <rect x="24" y="24" width="4" height="2" fill="#6b21a8"/>
  </g>
</svg>