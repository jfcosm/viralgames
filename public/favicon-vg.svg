<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1042"/>
      <stop offset="100%" stop-color="#0d061e"/>
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#bg2)" stroke="#ffe600" stroke-width="1.5" shape-rendering="geometricPrecision"/>
  <!-- Yellow ambient glow -->
  <circle cx="16" cy="16" r="9" fill="#ffe600" opacity="0.15" filter="url(#glow2)"/>
  <!-- "V" (Left, x=4..13, y=8..24) -->
  <!-- V Drop Shadow -->
  <g fill="#b45309">
    <rect x="5" y="9" width="3" height="10"/>
    <rect x="12" y="9" width="3" height="10"/>
    <rect x="8" y="19" width="4" height="4"/>
    <rect x="9" y="23" width="2" height="2"/>
  </g>
  <!-- V Main Face -->
  <g fill="#ffe600">
    <rect x="4" y="8" width="3" height="10"/>
    <rect x="11" y="8" width="3" height="10"/>
    <rect x="7" y="18" width="4" height="4"/>
    <rect x="8" y="22" width="2" height="2"/>
  </g>
  <!-- V Top highlight -->
  <g fill="#fef08a">
    <rect x="4" y="8" width="3" height="2"/>
    <rect x="11" y="8" width="3" height="2"/>
  </g>
  <!-- "G" (Right, x=16..27, y=8..24) -->
  <!-- G Drop Shadow -->
  <g fill="#b45309">
    <rect x="18" y="9" width="10" height="3"/>
    <rect x="18" y="12" width="3" height="10"/>
    <rect x="18" y="22" width="10" height="3"/>
    <rect x="23" y="16" width="5" height="3"/>
    <rect x="25" y="19" width="3" height="4"/>
  </g>
  <!-- G Main Face -->
  <g fill="#ffe600">
    <rect x="17" y="8" width="10" height="3"/>
    <rect x="17" y="11" width="3" height="10"/>
    <rect x="17" y="21" width="10" height="3"/>
    <rect x="22" y="15" width="5" height="3"/>
    <rect x="24" y="18" width="3" height="4"/>
  </g>
  <!-- G Top Highlight -->
  <g fill="#fef08a">
    <rect x="17" y="8" width="10" height="2"/>
  </g>
</svg>